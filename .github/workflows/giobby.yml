name: Build and Deploy Giobby

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "db/**"
      - "docker-compose.yml"
      - ".github/workflows/giobby.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image for giobby backend
        run: docker build -t alexgiura/giobby-backend:prod -f backend/Dockerfile .

      - name: Push Docker image for giobby backend
        run: docker push alexgiura/giobby-backend:prod

      - name: Build Docker image for giobby db
        run: docker build -t alexgiura/giobby-db:prod -f db/Dockerfile db

      - name: Push Docker image for giobby db
        run: docker push alexgiura/giobby-db:prod

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Prune unused Docker images (keep volumes)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}" \
            "docker system prune -f"

      - name: Ensure deployment directory exists on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}" \
            "mkdir -p ~/giobby/backend"

      - name: Write production env file
        run: |
          printf '%s\n' "${{ secrets.GIOBBY_ENV }}" > backend.env

      - name: Copy compose and env to server
        run: |
          scp -P "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa \
            docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}:~/giobby/docker-compose.yml"
          scp -P "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa \
            backend.env \
            "${{ secrets.SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}:~/giobby/backend/.env"

      - name: Pull images and restart services
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}" "
              docker pull alexgiura/giobby-backend:prod &&
              docker pull alexgiura/giobby-db:prod &&
              docker compose -f ~/giobby/docker-compose.yml up -d --force-recreate
            "
