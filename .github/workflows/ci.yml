name: CI

# Runs on every pull request and on pushes to dev and main. On main, and only
# when every job is green, it fast-forwards `release` to the tested commit:
# Coolify deploys production from `release`, so a red CI never reaches production
# (GitHub Free cannot block the merge button on private repositories).

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same version as the shared production Postgres (cloud4job-infra).
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      GIOBBY_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Files to format with gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: Tests (migrations against PostgreSQL 18)
        run: go test -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (API + migrate)
        run: docker build -f backend/Dockerfile -t giobby-backend:ci .
      - name: Build API Explorer image
        run: docker build -t giobby-api-explorer:ci ./api-explorer
      - name: Check production compose
        run: scripts/check-prod-compose.sh
      - name: Test branch guard filter
        run: scripts/test-branch-guard.sh

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward release to the tested commit
        # No --force: if release cannot fast-forward, the job fails and production stays as it is.
        run: git push origin "$GITHUB_SHA:refs/heads/release"
