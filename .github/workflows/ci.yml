name: CI

# Every PR and push to dev/main runs the stack checks in Docker (.cloud4job/run.sh).
# On main, and only if every job is green, `release` is fast-forwarded to the tested
# commit: Coolify deploys from `release`, so a red CI never reaches production.

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: .cloud4job/run.sh fmt-check
      - name: Lint
        run: .cloud4job/run.sh lint
      - name: Tests
        run: .cloud4job/run.sh test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (API + migrate)
        run: .cloud4job/run.sh build
      - name: Build API Explorer image
        run: docker build -t giobby-api-explorer:ci ./api-explorer
      - name: Check production compose
        run: scripts/check-prod-compose.sh
      - name: Test branch guard filter
        run: scripts/test-branch-guard.sh

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: The commit is the merge of a pull request into main
        # A direct push to main with green CI must not reach production.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: .github/branch-guard.sh main
      - name: Fast-forward release to the tested commit
        # No --force: if release cannot fast-forward, the job fails and production stays as it is.
        run: git push origin "$GITHUB_SHA:refs/heads/release"
