# Local development stack. Production uses docker-compose.prod.yml on Coolify.
# Values come from backend/.env (copy of backend/.env.example, synthetic only).

services:

  db:
    image: postgres:17.11-alpine
    container_name: giobby_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-postgres-password
    volumes:
      - giobby_pgdata:/var/lib/postgresql/data
      - ./dev/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d giobby"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["./migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB_HOST: db
      POSTGRES_DB_PORT: "5432"
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: giobby_backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DB_HOST: db
      POSTGRES_DB_PORT: "5432"
      POSTGRES_DB_SSLMODE: disable
      SWAGGER_PATH: /root/swagger.json
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  api-explorer:
    build: ./api-explorer
    container_name: giobby_api_explorer
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - app

volumes:
  giobby_pgdata:
    name: giobby_pgdata

networks:
  app:
    driver: bridge
