services:

  db:
    image: alexgiura/giobby-db:prod
    build: ./db
    container_name: giobby_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-giobby_bff}
    volumes:
      - giobby_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    image: alexgiura/giobby-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: giobby_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DB_HOST: db
      POSTGRES_DB_PORT: "5432"
      POSTGRES_DB_SSLMODE: disable
      SWAGGER_PATH: /root/swagger.json
    ports:
      - "8080:8080"
    networks:
      - app

  api-explorer:
    image: alexgiura/giobby-api-explorer:prod
    build: ./api-explorer
    container_name: giobby_api_explorer
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - app

volumes:
  giobby_pgdata:
    name: giobby_pgdata

networks:
  app:
    driver: bridge
